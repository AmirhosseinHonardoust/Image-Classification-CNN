[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classification-cnn"
version = "0.1.0"
description = "CNN image classification (MNIST/CIFAR10) with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "scikit-learn==1.4.2",
    "tqdm==4.66.4",
]

[project.scripts]
train-cnn = "image_classification_cnn.train_cnn:main"
evaluate-cnn = "image_classification_cnn.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_classification_cnn = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=image_classification_cnn --cov-report=term-missing"

[tool.coverage.run]
source = ["image_classification_cnn"]
branch = true
